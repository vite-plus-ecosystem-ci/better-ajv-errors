allowBuilds:
  esbuild: true

overrides:
  '@babel/runtime@<7.26.10': '>=7.26.10'
  cross-spawn@<6.0.6: '>=6.0.6'
  cross-spawn@>=7.0.0 <7.0.5: '>=7.0.5'
  node-fetch@<2.6.7: '>=2.6.7'
  nth-check@<2.0.1: '>=2.0.1'
  plist@<3.0.5: '>=3.0.5'
  semver@<5.7.2: '>=5.7.2'
  semver@>=7.0.0 <7.5.2: '>=7.5.2'
  trim-newlines@<3.0.1: '>=3.0.1'
  '@xmldom/xmldom': '0.9.12'
  vite@*: 'catalog:'
  vitest@*: 'catalog:'
catalog:
  vite: npm:@voidzero-dev/vite-plus-core@0.0.0-commit.6bc2d240a024170c08fbc831f0c201c162afd22e
  vitest: 5.0.5
  vite-plus: 0.0.0-commit.6bc2d240a024170c08fbc831f0c201c162afd22e
  '@vitest/coverage-v8': 5.0.5
  '@vitest/ui': 5.0.5
peerDependencyRules:
  allowAny:
    - vite
    - vitest
  allowedVersions:
    vite: '*'
    vitest: '*'
versioning:
  changelog:
    # Keeps `CHANGELOG.md` in the repository, where the Release workflow reads the release notes.
    storage: repository
minimumReleaseAgeExclude:
  # ecosystem-ci smoke test: preview builds and freshly pinned toolchain packages
  - vite-plus
  - '@voidzero-dev/*'
  - '@oxc-project/*'
  - oxlint
  - '@oxlint/*'
  - oxfmt
  - '@oxfmt/*'
  - oxlint-tsgolint
  - '@oxlint-tsgolint/*'
  - vitest
  - '@vitest/*'
  - tinybench
  - yuku-core
  - yuku-parser
  - '@yuku-core/*'
  - '@yuku-toolchain/*'
